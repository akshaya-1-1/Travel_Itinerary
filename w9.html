<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Best JOBs Registration</title>
<link rel="stylesheet" href="w9style.css">
</head>
<body>
<h1>Best JOBs Registration Wizard</h1>

<form id="regForm">

<div class="step" id="step-1">
<h2>Step 1: Account Set-Up</h2>
<label for="username">User Name:</label>
<input type="text" id="username" name="username" required><br>
<label for="password">Password:</label>
<input type="password" id="password" name="password" required><br>
<label for="confirmPassword">Confirm Password:</label>
<input type="password" id="confirmPassword" name="confirmPassword" required><br>
</div>

<div class="step" id="step-2" style="display: none;">
<h2>Step 2: Personal Details</h2>
<label for="firstName">First Name:</label>
<input type="text" id="firstName" name="firstName" required><br>
<label for="lastName">Last Name:</label>
<input type="text" id="lastName" name="lastName" required><br>
<label>Gender:</label>
<input type="radio" id="male" name="gender" value="male" required> <label for="male">Male</label>
<input type="radio" id="female" name="gender" value="female"> <label for="female">Female</label>
<input type="radio" id="other" name="gender" value="other"> <label for="other">Other</label><br>
<label for="nationality">Nationality:</label>
<input type="text" id="nationality" name="nationality" required><br>
<label for="dob">Date of Birth:</label>
<input type="date" id="dob" name="dob" required><br>
</div>

<div class="step" id="step-3" style="display: none;">
<h2>Step 3: Contact Details</h2>
<label for="email">E-mail:</label>
<input type="email" id="email" name="email" required><br>
<label for="phone">Phone:</label>
<input type="tel" id="phone" name="phone" required><br>
<label for="address">Address:</label>
<textarea id="address" name="address" required></textarea><br>
</div>

<div class="step" id="step-4" style="display: none;">
<h2>Step 4: Social Profiles</h2>
<label for="twitter">Twitter URL:</label>
<input type="url" id="twitter" name="twitter"><br>
<label for="facebook">Facebook URL:</label>
<input type="url" id="facebook" name="facebook"><br>
<label for="google">Google Profile URL:</label>
<input type="url" id="google" name="google"><br>
</div>

<div class="step" id="step-5" style="display: none;">
<h2>Step 5: Academic Details</h2>
<label for="ugCgpa">UG CGPA:</label>
<input type="number" id="ugCgpa" name="ugCgpa" step="0.01" min="0" max="10" required><br>
<label for="pgCgpa">PG CGPA:</label>
<input type="number" id="pgCgpa" name="pgCgpa" step="0.01" min="0" max="10"><br> <label for="project1Title">Project 1 Title:</label>
<input type="text" id="project1Title" name="project1Title" required><br>
<label for="project1Abstract">Project 1 Abstract:</label>
<textarea id="project1Abstract" name="project1Abstract" required></textarea><br>
<label for="project2Title">Project 2 Title:</label>
<input type="text" id="project2Title" name="project2Title" required><br>
<label for="project2Abstract">Project 2 Abstract:</label>
<textarea id="project2Abstract" name="project2Abstract" required></textarea><br>
<label for="project3Title">Project 3 Title:</label>
<input type="text" id="project3Title" name="project3Title" required><br>
<label for="project3Abstract">Project 3 Abstract:</label>
<textarea id="project3Abstract" name="project3Abstract" required></textarea><br>
</div>

<div class="step" id="step-6" style="display: none;">
<h2>Step 6: Confirmation</h2>
<p>Please review your details:</p>
<div id="confirmationDetails">
</div>
</div>

<div class="step" id="step-7" style="display: none;">
<h2>Registration Successful!</h2>
<p>Thank you for registering with Best JOBs.</p>
</div>

<div class="navigation-buttons">
<button type="button" id="prevBtn" onclick="navigate(-1)">Previous</button>
<button type="button" id="nextBtn" onclick="navigate(1)">Next</button>
</div>

</form>

<script src="w9script.js"></script>
</body>
</html>
