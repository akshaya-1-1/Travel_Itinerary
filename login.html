<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Our World - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        /* --- Global Styles & Fonts --- */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap');

        :root {
            --primary-color: #6C63FF; /* Vibrant purple-blue */
            --primary-dark: #5A54D9;
            --background-page: #ffffff; /* Page background is white */
            --background-container: #f0f4f8; /* Light grey container background */
            --text-dark: #212529;
            --text-light: #f8f8f8;
            --subtle-text: #6C757D;
            --border-color: #DEE2E6;
            --error-color: #DC3545;
            --error-background: #F8D7DA;
            --focus-ring: rgba(108, 99, 255, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
             scroll-behavior: smooth;
             min-width: 395px;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--background-page);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            line-height: 1.6;
            padding: 15px;
            color: var(--text-dark);
            min-width: 395px;
        }

        /* --- Main Login Container --- */
        .login-container {
            display: flex;
            width: 100%;
            max-width: 950px;
            min-height: 580px;
            background: var(--background-container);
            border-radius: 15px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            transition: all 0.3s ease-out;
        }

        /* --- 1. Welcome Panel (Left Side - Image Panel) --- */
        .welcome-panel {
            flex-basis: 50%;
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.6)),
                        url('img1.jpg');
            background-size: cover;
            background-position: center;
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
            border-radius: 15px 0 0 15px;
            transition: padding 0.3s ease-out;
        }

        .welcome-content h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            margin-bottom: 15px;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.6);
            transition: font-size 0.3s ease-out;
        }

        .welcome-content p {
            font-size: 1.1rem;
            margin-bottom: 25px;
            max-width: 350px;
            transition: opacity 0.3s ease-out, font-size 0.3s ease-out, max-height 0.4s ease-out;
            opacity: 1;
            max-height: 200px;
            overflow: hidden;
        }

        .cta-button {
            display: inline-block;
            background-color: transparent;
            border: 2px solid var(--text-light);
            color: var(--text-light);
            padding: 10px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .cta-button:hover, .cta-button:focus {
            background-color: var(--text-light);
            color: var(--primary-color);
            outline: 2px solid var(--primary-color);
            outline-offset: 2px;
        }

        /* --- 2. Login Form Panel (Right Side) --- */
        .login-panel {
            flex-basis: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            background-color: #ffffff;
            border-radius: 0 15px 15px 0;
            transition: padding 0.3s ease-out;
        }

        .login-form-container {
            width: 100%;
            max-width: 360px;
        }

        .login-header {
            text-align: right;
            font-size: 0.9rem;
            margin-bottom: 25px;
            color: var(--subtle-text);
        }
        .login-header a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }
        .login-header a:hover, .login-header a:focus {
            text-decoration: underline;
            outline: 1px dotted var(--primary-color);
            outline-offset: 2px;
        }
        .login-form-container h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2.4rem;
            color: var(--text-dark);
            margin-bottom: 10px;
        }
        .login-form-container > p.subtitle {
            font-size: 1rem;
            color: var(--subtle-text);
            margin-bottom: 30px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-dark);
            margin-bottom: 6px;
        }
        
        /* Input fields without icons - simplified padding */
        .input-group input[type="email"],
        .input-group input[type="password"] {
            width: 100%;
            padding: 12px 15px; /* Removed left padding for icons */
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            background-color: #fcfcfc;
            color: var(--text-dark);
        }
        .input-group input[type="email"]:focus,
        .input-group input[type="password"]:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px var(--focus-ring);
            background-color: #fff;
        }
        
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 0.9rem;
            color: var(--subtle-text);
            flex-wrap: wrap;
            gap: 10px;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
        }
        .checkbox-group input[type="checkbox"] {
            margin-right: 8px;
            accent-color: var(--primary-color);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .checkbox-group input[type="checkbox"]:focus + label {
            outline: 1px dotted var(--primary-color);
            outline-offset: 2px;
        }
        .checkbox-group label {
            margin-bottom: 0;
            font-weight: 400;
            cursor: pointer;
        }
        .forgot-password {
            color: var(--primary-color);
            text-decoration: none;
        }
        .forgot-password:hover, .forgot-password:focus {
            text-decoration: underline;
            outline: 1px dotted var(--primary-color);
            outline-offset: 2px;
        }
        .login-button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease, box-shadow 0.3s ease;
        }
        .login-button:hover {
            background-color: var(--primary-dark);
        }
        .login-button:active {
            transform: scale(0.98);
        }
        .login-button:focus {
            outline: none;
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        /* --- Validation & Accessibility --- */
        .error-message {
            color: var(--error-color);
            background-color: var(--error-background);
            border: 1px solid var(--error-color);
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .input-group input.input-error {
            border-color: var(--error-color);
        }
        .input-group input.input-error:focus {
            box-shadow: 0 0 0 3px rgba(220, 53, 69, 0.2);
        }

        /* --- Responsiveness --- */
        /* Small Screens: Stack & Hide Welcome Text */
        @media (max-width: 700px) {
            .login-container {
                flex-direction: column;
                width: 100%;
                max-width: 450px;
                min-height: auto;
                border-radius: 10px;
                background: var(--background-container);
                min-width: 395px;
            }

            .welcome-panel {
                flex-basis: auto;
                min-height: 200px;
                border-radius: 10px 10px 0 0;
                padding: 25px 15px;
                justify-content: flex-end;
                padding-bottom: 30px;
            }

            .welcome-content h1 {
                font-size: 1.8rem;
                margin-bottom: 10px;
            }
            .welcome-content p {
                opacity: 0;
                max-height: 0;
                margin-bottom: 0;
                font-size: 0;
                padding: 0;
                overflow: hidden;
            }
            .cta-button {
                padding: 8px 20px;
                font-size: 0.9rem;
            }

            .login-panel {
                flex-basis: auto;
                padding: 30px 20px;
                width: 100%;
                background-color: #ffffff;
                border-radius: 0 0 10px 10px;
            }

            .login-form-container {
                max-width: none;
            }
            .login-form-container h2 {
                font-size: 2rem;
            }
            .login-form-container > p.subtitle {
                font-size: 0.95rem;
            }
        }

        /* Extra small screen protection */
        @media (max-width: 394px) {
            body {
                overflow-x: auto;
            }
            
            .login-container {
                min-width: 395px;
            }
        }
    </style>
</head>
<body>

    <main class="login-container">

        <section class="welcome-panel" aria-labelledby="welcome-heading">
            <div class="welcome-content">
                <h1 id="welcome-heading">Your Next Adventure Awaits</h1>
                <p>Log in to manage your trips, save your favorite destinations, and unlock exclusive travel deals. ✈️🌍</p>
                <a href="#" class="cta-button">Learn More</a>
            </div>
        </section>

        <section class="login-panel" aria-labelledby="login-heading">
            <div class="login-form-container">
                <div class="login-header">
                    <span>Don't have an account?</span> <a href="signup.html">Sign Up</a>
                </div>

                <h2 id="login-heading">Member Login</h2>
                <p class="subtitle">Access your UdupiVista account.</p>

                <form id="loginForm" novalidate>
                    <div id="errorMessage" class="error-message" role="alert" aria-live="polite"></div>

                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required aria-required="true" autocomplete="email">
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required aria-required="true" autocomplete="current-password">
                    </div>

                    <div class="form-options">
                        <div class="checkbox-group">
                            <input type="checkbox" id="rememberMe" name="rememberMe">
                            <label for="rememberMe">Remember me</label>
                        </div>
                        <a href="#" class="forgot-password">Forgot Password?</a>
                    </div>

                    <button type="submit" class="login-button">Login to Explore</button>
                </form>

            </div>
        </section>

    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const loginForm = document.getElementById("loginForm");
            const emailInput = document.getElementById("email");
            const passwordInput = document.getElementById("password");
            const errorMessage = document.getElementById("errorMessage");

            loginForm.addEventListener("submit", function(event) {
                event.preventDefault(); // Stop default form submission
                clearErrors(); // Clear previous errors

                let hasError = false;

                // --- Validation ---
                // 1. Check Email
                if (emailInput.value.trim() === "") {
                    showError("Please enter your email address.");
                    emailInput.classList.add("input-error");
                    emailInput.focus(); // Set focus to the first invalid field
                    hasError = true;
                } else if (!isValidEmail(emailInput.value.trim())) { // Optional: Basic email format check
                    showError("Please enter a valid email address.");
                    emailInput.classList.add("input-error");
                    emailInput.focus();
                    hasError = true;
                }

                // 2. Check Password (only if email is okay)
                if (!hasError && passwordInput.value.trim() === "") {
                    showError("Please enter your password.");
                    passwordInput.classList.add("input-error");
                    passwordInput.focus();
                    hasError = true;
                }

                // --- Submission ---
                if (!hasError) {
                    console.log("Form is valid. Submitting...");
                    // In a real app, you'd send data to the server here (e.g., using fetch)
                    alert("Login successful! Welcome back, explorer! (Demo)");
                    // loginForm.submit(); // Uncomment to allow actual form submission
                }
            });

            // --- Helper Functions ---
            function showError(message) {
                errorMessage.textContent = message;
                errorMessage.style.display = "block";
            }

            function clearErrors() {
                errorMessage.textContent = "";
                errorMessage.style.display = "none";
                emailInput.classList.remove("input-error");
                passwordInput.classList.remove("input-error");
            }

            // Optional: Basic email validation function
            function isValidEmail(email) {
                // Simple regex for basic email format check
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return emailRegex.test(email);
            }

            // Clear errors when user starts typing again (improves UX)
            emailInput.addEventListener("input", clearErrors);
            passwordInput.addEventListener("input", clearErrors);
        });

        // Prevent viewport from shrinking below 395px
        (function() {
            const minWidth = 395;
            
            function enforceMinWidth() {
                if (window.innerWidth < minWidth) {
                    document.body.style.minWidth = minWidth + 'px';
                    document.documentElement.style.minWidth = minWidth + 'px';
                } else {
                    document.body.style.minWidth = '';
                    document.documentElement.style.minWidth = '';
                }
            }
            
            window.addEventListener('resize', enforceMinWidth);
            window.addEventListener('load', enforceMinWidth);
            enforceMinWidth();
        })();
    </script>
</body>
</html>
